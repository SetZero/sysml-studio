name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ANTLR generates the parser at build time and needs a JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Format
        run: dotnet format SysmlStudio.slnx --verify-no-changes --severity info

      - name: Build
        run: dotnet build SysmlStudio.slnx -warnaserror --nologo

      - name: Test
        run: dotnet test SysmlStudio.slnx --no-build --nologo
